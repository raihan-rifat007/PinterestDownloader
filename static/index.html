<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080c">
<meta name="description" content="Download Pinterest pins, boards, and profiles in high quality.">
<meta property="og:title" content="Pinterest Downloader">
<meta property="og:description" content="Download Pinterest pins, boards, and profiles in high quality.">
<meta property="og:image" content="/asset/Logo.png">
<meta name="twitter:card" content="summary_large_image">
<title>Pinterest Downloader</title>
<link rel="icon" type="image/png" href="/asset/Logo.png">
<link rel="apple-touch-icon" href="/asset/Logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --red-300:#fda4af;
  --red-400:#f43f5e;
  --red-500:#e60023;
  --red-600:#c4001e;
  --emerald-500:#10b981;
  --amber-500:#f59e0b;
  --violet-400:#a78bfa;
  --bg:#08080c;
  --bg-1:#0d0d14;
  --bg-2:#13131c;
  --bg-3:#1a1a26;
  --bg-4:#22222f;
  --surface:rgba(255,255,255,.03);
  --surface-hover:rgba(255,255,255,.06);
  --surface-active:rgba(230,0,35,.12);
  --border:rgba(255,255,255,.07);
  --border-strong:rgba(255,255,255,.14);
  --border-accent:rgba(230,0,35,.35);
  --text:#f5f5f8;
  --text-2:#a5a5b8;
  --text-3:#6e6e85;
  --text-4:#4a4a5a;
  --accent:#e60023;
  --accent-2:#f43f5e;
  --accent-glow:rgba(230,0,35,.4);
  --accent-soft:rgba(230,0,35,.1);
  --gradient:linear-gradient(135deg,#e60023 0%,#f43f5e 100%);
  --gradient-subtle:linear-gradient(135deg,rgba(230,0,35,.15),rgba(244,63,94,.15));
  --radius-xs:6px;
  --radius-sm:10px;
  --radius:14px;
  --radius-lg:20px;
  --radius-xl:28px;
  --radius-full:999px;
  --shadow-xs:0 1px 2px rgba(0,0,0,.3);
  --shadow-sm:0 2px 8px rgba(0,0,0,.3);
  --shadow:0 8px 24px rgba(0,0,0,.4);
  --shadow-lg:0 20px 60px rgba(0,0,0,.5);
  --shadow-xl:0 40px 100px rgba(0,0,0,.6);
  --shadow-accent:0 8px 28px rgba(230,0,35,.35);
  --ease:cubic-bezier(.16,1,.3,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --topbar-h:64px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}
[data-theme="light"] {
  --bg:#fafafb;
  --bg-1:#ffffff;
  --bg-2:#f5f5f8;
  --bg-3:#eeeef3;
  --bg-4:#e4e4ec;
  --surface:rgba(0,0,0,.02);
  --surface-hover:rgba(0,0,0,.04);
  --surface-active:rgba(230,0,35,.08);
  --border:rgba(0,0,0,.07);
  --border-strong:rgba(0,0,0,.13);
  --border-accent:rgba(230,0,35,.35);
  --text:#0e0e16;
  --text-2:#5a5a6e;
  --text-3:#8a8a9a;
  --text-4:#b0b0be;
  --shadow-xs:0 1px 2px rgba(0,0,0,.05);
  --shadow-sm:0 2px 8px rgba(0,0,0,.06);
  --shadow:0 8px 24px rgba(0,0,0,.08);
  --shadow-lg:0 20px 60px rgba(0,0,0,.12);
  --shadow-xl:0 40px 100px rgba(0,0,0,.18);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;min-height:100dvh;
  font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  letter-spacing:-.01em;
  overflow-x:hidden;
  transition:background .3s var(--ease),color .3s var(--ease);
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 900px 600px at 15% -10%,rgba(230,0,35,.14),transparent 55%),
    radial-gradient(ellipse 700px 500px at 95% 0%,rgba(244,63,94,.09),transparent 55%);
  transition:opacity .3s var(--ease);
}
[data-theme="light"] body::before{opacity:.5}
button,input,textarea,select{font-family:inherit;color:inherit;background:none;border:none;outline:none}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
img{display:block;max-width:100%}
::selection{background:var(--accent);color:#fff}
svg{flex-shrink:0}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg-3);border-radius:var(--radius-full);border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--bg-4);background-clip:padding-box}

.splash{
  position:fixed;inset:0;z-index:9999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:20px;background:var(--bg);
  transition:opacity .4s var(--ease),visibility .4s;
}
.splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash-logo{
  width:96px;height:96px;border-radius:24px;
  background:var(--bg-2);border:1px solid var(--border-accent);
  padding:16px;object-fit:contain;
  box-shadow:0 20px 60px var(--accent-glow);
  animation:splashPulse 2s ease-in-out infinite;
}
@keyframes splashPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.splash-text{font-size:14px;font-weight:600;color:var(--text-2);letter-spacing:-.01em}
.splash-bar{
  width:180px;height:3px;border-radius:var(--radius-full);
  background:var(--bg-3);overflow:hidden;position:relative;
}
.splash-bar::after{
  content:'';position:absolute;inset:0;
  background:var(--gradient);border-radius:var(--radius-full);
  animation:splashBar 1.4s ease-in-out infinite;
  transform-origin:left;
}
@keyframes splashBar{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

.topbar{
  position:sticky;top:0;z-index:100;
  height:calc(var(--topbar-h) + var(--safe-t));
  padding-top:var(--safe-t);
  padding-left:max(16px,var(--safe-l));
  padding-right:max(16px,var(--safe-r));
  display:flex;align-items:center;gap:14px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--border);
}
.brand{
  display:flex;align-items:center;gap:10px;
  text-decoration:none;color:inherit;flex-shrink:0;
  padding:4px 8px 4px 4px;border-radius:var(--radius-full);
  transition:background .15s var(--ease);
}
.brand:hover{background:var(--surface-hover)}
.brand-logo{
  width:32px;height:32px;border-radius:9px;
  object-fit:contain;background:var(--bg-2);padding:3px;
  box-shadow:var(--shadow-accent),inset 0 1px 0 rgba(255,255,255,.1);
  transition:transform .3s var(--ease-spring);
}
.brand:hover .brand-logo{transform:rotate(-8deg) scale(1.06)}
.brand-name{font-weight:700;font-size:15px;letter-spacing:-.02em;color:var(--text)}
.brand-name em{color:var(--accent);font-style:normal;font-weight:700}
.brand-tag{
  font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 8px;border-radius:var(--radius-full);
  background:var(--gradient-subtle);
  border:1px solid var(--border-accent);
  color:var(--red-300);
  margin-left:2px;
}
[data-theme="light"] .brand-tag{color:var(--red-500)}
.cmd-trigger{
  flex:1;max-width:520px;margin:0 auto;
  height:38px;padding:0 12px 0 14px;
  display:flex;align-items:center;gap:10px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-full);
  color:var(--text-3);font-size:13px;font-weight:500;
  transition:all .15s var(--ease);
}
.cmd-trigger:hover{background:var(--surface-hover);border-color:var(--border-strong);color:var(--text-2)}
.cmd-trigger svg{width:15px;height:15px}
.cmd-trigger span{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmd-trigger kbd{
  font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;
  padding:2px 6px;border-radius:5px;
  background:var(--bg-2);border:1px solid var(--border);
  color:var(--text-3);display:inline-flex;gap:2px;align-items:center;
}
.cmd-trigger kbd kbd{background:none;border:none;padding:0;font-size:11px;color:inherit}
.topbar-actions{display:flex;gap:4px;align-items:center;flex-shrink:0}
.icon-btn{
  width:38px;height:38px;border-radius:10px;
  display:grid;place-items:center;
  color:var(--text-2);background:transparent;
  transition:all .15s var(--ease);position:relative;
}
.icon-btn:hover{background:var(--surface-hover);color:var(--text)}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:17px;height:17px}
.icon-btn.active{background:var(--surface-active);color:var(--accent)}
.icon-btn .count-badge{
  position:absolute;top:-2px;right:-2px;
  min-width:16px;height:16px;padding:0 4px;
  border-radius:var(--radius-full);
  background:var(--accent);color:#fff;
  font-family:'JetBrains Mono',monospace;
  font-size:9px;font-weight:700;
  display:grid;place-items:center;
  border:2px solid var(--bg);
}
.status-pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 10px;border-radius:var(--radius-full);
  background:var(--surface);border:1px solid var(--border);
  font-size:11px;font-weight:600;color:var(--text-3);
  letter-spacing:.02em;
}
.status-pill .dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--emerald-500);
  box-shadow:0 0 0 3px rgba(16,185,129,.18);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

.main{
  position:relative;z-index:1;
  max-width:1280px;margin:0 auto;
  padding:32px max(20px,var(--safe-l)) calc(120px + var(--safe-b)) max(20px,var(--safe-r));
}

.hero{
  text-align:center;
  padding:32px 16px 40px;
  animation:fadeUp .6s var(--ease) both;
}
.hero.hidden{display:none}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.hero-eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  padding:6px 14px;margin-bottom:20px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-full);
  font-size:12px;font-weight:600;
  color:var(--text-2);
}
.hero-eyebrow .dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--emerald-500);
  box-shadow:0 0 0 3px rgba(16,185,129,.2);
  animation:pulse 2s ease-in-out infinite;
}
.hero h1{
  font-size:clamp(28px,5vw,44px);
  font-weight:800;
  letter-spacing:-.04em;
  line-height:1.05;
  margin-bottom:14px;
  background:linear-gradient(135deg,var(--text) 30%,var(--text-2));
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}
.hero h1 em{
  background:var(--gradient);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  font-style:normal;
}
.hero p{
  font-size:15px;
  color:var(--text-3);
  max-width:560px;
  margin:0 auto 28px;
  line-height:1.6;
}
.hero-tips{
  display:flex;flex-wrap:wrap;gap:8px;
  justify-content:center;
  max-width:640px;margin:0 auto;
}
.hero-tip{
  padding:8px 14px;
  background:var(--bg-2);
  border:1px solid var(--border);
  border-radius:var(--radius-full);
  font-size:12px;font-weight:500;
  color:var(--text-3);
  cursor:pointer;
  transition:all .15s var(--ease);
}
.hero-tip:hover{
  border-color:var(--border-accent);
  color:var(--accent);
  background:var(--surface-active);
  transform:translateY(-1px);
}

.search-shell{
  position:sticky;top:calc(var(--topbar-h) + var(--safe-t));z-index:50;
  padding:12px 0;
  margin-bottom:20px;
  background:linear-gradient(to bottom,var(--bg) 40%,transparent);
  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);
}
.search-bar{
  position:relative;
  display:flex;align-items:center;gap:10px;
  padding:8px 8px 8px 18px;
  background:var(--bg-1);
  border:1px solid var(--border-strong);
  border-radius:var(--radius-full);
  box-shadow:var(--shadow-lg);
  transition:all .2s var(--ease);
}
.search-bar:focus-within{
  border-color:var(--border-accent);
  box-shadow:var(--shadow-lg),0 0 0 4px var(--accent-soft);
}
.search-bar .search-ico{
  width:20px;height:20px;
  color:var(--text-3);
  flex-shrink:0;
  transition:color .15s;
}
.search-bar:focus-within .search-ico{color:var(--accent)}
.search-bar input{
  flex:1;min-width:0;
  font-size:15px;font-weight:500;
  color:var(--text);
  padding:8px 0;
}
.search-bar input::placeholder{color:var(--text-4)}
.url-badge{
  display:none;align-items:center;gap:4px;
  padding:3px 8px;border-radius:var(--radius-full);
  background:var(--gradient-subtle);
  border:1px solid var(--border-accent);
  color:var(--red-300);
  font-family:'JetBrains Mono',monospace;
  font-size:10px;font-weight:600;letter-spacing:.04em;
  text-transform:uppercase;
  flex-shrink:0;
}
[data-theme="light"] .url-badge{color:var(--red-500)}
.url-badge.show{display:inline-flex}
.url-badge svg{width:11px;height:11px}
.search-btn{
  height:40px;padding:0 22px;
  border-radius:var(--radius-full);
  background:var(--gradient);
  color:#fff;font-size:14px;font-weight:700;
  letter-spacing:-.01em;
  display:inline-flex;align-items:center;gap:8px;
  box-shadow:var(--shadow-accent);
  transition:all .2s var(--ease);
  flex-shrink:0;
}
.search-btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 12px 32px var(--accent-glow)}
.search-btn:disabled{opacity:.6;cursor:not-allowed}
.search-btn svg{width:15px;height:15px}
.search-btn .spinner{
  width:14px;height:14px;border-radius:50%;
  border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.search-clear{
  width:26px;height:26px;border-radius:50%;
  display:none;place-items:center;
  color:var(--text-3);background:var(--bg-3);
  flex-shrink:0;
  transition:all .15s;
}
.search-clear:hover{background:var(--bg-4);color:var(--text)}
.search-clear.show{display:grid}
.search-clear svg{width:12px;height:12px}

.history-dropdown{
  position:absolute;top:calc(100% + 8px);left:0;right:0;
  background:var(--bg-1);
  border:1px solid var(--border-strong);
  border-radius:var(--radius);
  box-shadow:var(--shadow-xl);
  padding:6px;
  z-index:60;
  display:none;
  max-height:320px;overflow-y:auto;
}
.history-dropdown.show{display:block;animation:fadeIn .15s var(--ease)}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.history-head{
  padding:8px 10px 6px;
  display:flex;align-items:center;justify-content:space-between;
  font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text-4);
}
.history-head button{
  font-size:10px;font-weight:600;color:var(--text-3);
  padding:3px 6px;border-radius:5px;
  transition:background .15s;
}
.history-head button:hover{background:var(--surface-hover);color:var(--text)}
.history-item{
  width:100%;padding:9px 10px;
  display:flex;align-items:center;gap:10px;
  border-radius:8px;
  text-align:left;color:var(--text-2);
  font-size:13px;font-weight:500;
  transition:all .12s var(--ease);
}
.history-item:hover{background:var(--surface-hover);color:var(--text)}
.history-item svg{width:13px;height:13px;color:var(--text-4);flex-shrink:0}
.history-item .hist-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history-item .hist-remove{
  width:20px;height:20px;border-radius:5px;
  display:grid;place-items:center;
  color:var(--text-4);background:transparent;
  opacity:0;transition:all .15s;
  flex-shrink:0;
}
.history-item:hover .hist-remove{opacity:1}
.history-item .hist-remove:hover{background:var(--bg-3);color:var(--text)}

.controls{
  display:flex;align-items:center;gap:10px;
  flex-wrap:wrap;
  margin-bottom:16px;
  padding-bottom:16px;
  border-bottom:1px solid var(--border);
}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.chip{
  padding:7px 13px;border-radius:var(--radius-full);
  background:var(--bg-2);border:1px solid var(--border);
  color:var(--text-2);font-size:12.5px;font-weight:600;
  transition:all .15s var(--ease);
  display:inline-flex;align-items:center;gap:6px;
  white-space:nowrap;
}
.chip svg{width:12px;height:12px}
.chip:hover{border-color:var(--border-strong);color:var(--text);background:var(--bg-3)}
.chip.active{
  background:var(--surface-active);
  border-color:var(--border-accent);
  color:var(--accent);
}
.chip .chip-count{
  padding:1px 6px;border-radius:var(--radius-full);
  background:var(--bg-3);color:var(--text-3);
  font-family:'JetBrains Mono',monospace;
  font-size:10px;font-weight:700;
}
.chip.active .chip-count{background:var(--accent);color:#fff}
.controls-spacer{flex:1;min-width:0}
.segment{
  display:inline-flex;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:3px;gap:2px;
  flex-shrink:0;
}
.segment button{
  width:32px;height:28px;border-radius:7px;
  display:grid;place-items:center;
  color:var(--text-3);background:transparent;
  transition:all .15s var(--ease);
}
.segment button:hover{color:var(--text);background:var(--surface-hover)}
.segment button.active{background:var(--bg-4);color:var(--text)}
.segment button svg{width:14px;height:14px}

.results-info{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
  font-size:13px;color:var(--text-3);
}
.results-info .ri-left{display:flex;align-items:center;gap:10px;min-width:0}
.results-info .ri-title{
  font-weight:600;color:var(--text-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.results-info .ri-count{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;font-weight:600;
  padding:3px 9px;border-radius:var(--radius-full);
  background:var(--bg-2);border:1px solid var(--border);
  color:var(--text-3);
  flex-shrink:0;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:16px;
  align-content:start;
}
.grid.layout-compact{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.grid.layout-large{grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}

.card{
  border-radius:var(--radius);
  overflow:hidden;
  background:var(--bg-2);
  border:1px solid var(--border);
  position:relative;
  transition:all .3s var(--ease);
  animation:cardIn .35s var(--ease) both;
  display:flex;flex-direction:column;
}
@keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.card:hover{
  border-color:var(--border-accent);
  transform:translateY(-3px);
  box-shadow:var(--shadow-lg),0 0 0 1px var(--border-accent);
}
.card.selected{
  border-color:var(--accent);
  box-shadow:0 0 0 2px var(--accent),var(--shadow-lg);
}
.card.selected::after{
  content:'';position:absolute;top:10px;left:10px;
  width:24px;height:24px;border-radius:50%;
  background:var(--accent);
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 24 24' width='14' height='14' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' xmlns='http://www.w3.org/2000/svg'%3E%3Cpolyline points='20 6 9 17 4 12'/%3E%3C/svg%3E");
  background-position:center;background-repeat:no-repeat;

const $$ = (sel, root = document) => Array.from((root || document).querySelectorAll(sel));

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') node.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
    else if (k === 'html') node.innerHTML = v;
    else if (k === 'text') node.textContent = v;
    else if (v !== undefined && v !== null) node.setAttribute(k, v);
  }
  for (const c of [].concat(children)) {
    if (c == null) continue;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return node;
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',

}

  if (!pin.download_url) return null;
  const params = new URLSearchParams({
    url: pin.download_url,
    filename: pin.filename || `pin-${pin.pin_id || Date.now()}.jpg`,
  });
  return `${CONFIG.downloadEndpoint}?${params.toString()}`;
}

function toast(msg, type = 'info', action = null) {
  const wrap = $('toasts');
  const icons = { success: ICONS.check, error: ICONS.x, info: ICONS.info };
  const node = el('div', { class: `toast ${type}` });
  node.innerHTML = `<div class="toast-icon">${icons[type] || icons.info}</div><span>${escapeHtml(msg)}</span>`;
  if (action && action.label) {
    const btn = el('button', { class: 'toast-action', text: action.label });
    btn.addEventListener('click', () => {
      try { action.onClick && action.onClick(); } finally {
        node.classList.add('out');
        setTimeout(() => node.remove(), 250);
      }
    });
    node.appendChild(btn);
  }
  wrap.appendChild(node);
  setTimeout(() => {
    node.classList.add('out');
    setTimeout(() => node.remove(), 250);
  }, action ? 5000 : 2600);
}

function applyTheme(t) {
  state.theme = t;
  document.documentElement.setAttribute('data-theme', t);
  $('themeIcon').innerHTML = t === 'dark'
    ? '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'
    : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>';
  document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'dark' ? '#08080c' : '#fafafb');
  store.set(CONFIG.storage.theme, t);
}

function setLayout(mode) {
  state.layout = mode;
  const g = $('grid');
  g.className = 'grid' + (mode === 'compact' ? ' layout-compact' : mode === 'large' ? ' layout-large' : '');
  $$('#layoutSeg button').forEach(b => b.classList.toggle('active', b.dataset.layout === mode));
  store.set(CONFIG.storage.layout, mode);
}

function loadFavorites() {
  const raw = store.get(CONFIG.storage.favorites, []);
  state.favorites = new Map(raw.map(p => [p.pin_id, p]));
}

function saveFavorites() {
  store.set(CONFIG.storage.favorites, Array.from(state.favorites.values()));
  updateFavBadge();
}

function updateFavBadge() {
  const count = state.favorites.size;
  const badge = $('favCount');
  if (count > 0) {
    badge.textContent = count > 99 ? '99+' : count;
    badge.style.display = 'grid';
  } else {
    badge.style.display = 'none';
  }
}

function isFavorite(pinId) {
  return state.favorites.has(pinId);
}

function toggleFavorite(pin) {
  if (!pin || !pin.pin_id) return;
  if (state.favorites.has(pin.pin_id)) {
    state.favorites.delete(pin.pin_id);
    toast('Removed from favorites', 'info');
  } else {
    state.favorites.set(pin.pin_id, {
      pin_id: pin.pin_id,
      pin_url: pin.pin_url,
      title: pin.title,
      thumbnail_url: pin.thumbnail_url,
      download_url: pin.download_url,
      filename: pin.filename,
      is_video: pin.is_video,
      savedAt: Date.now(),
    });
    toast('Added to favorites', 'success');
  }
  saveFavorites();
  refreshFavoriteUI();
}

function refreshFavoriteUI() {
  $$('.card').forEach(card => {
    const pinId = card.dataset.pinId;
    const fav = card.querySelector('.card-fav');
    if (fav) {
      const isF = isFavorite(pinId);
      fav.classList.toggle('active', isF);
      fav.innerHTML = isF ? ICONS.heartFill : ICONS.heart;
    }
  });
  if (state.activePin) {
    const isF = isFavorite(state.activePin.pin_id);
    const lbFav = $('lbFav');
    lbFav.innerHTML = isF ? ICONS.heartFill : ICONS.heart;
    lbFav.classList.toggle('btn-soft', isF);
  }
  if (state.filter === 'favorites') {
    applyFilter();
  }
}

function addHistory(query) {
  if (!query) return;
  const trimmed = query.trim();
  state.history = state.history.filter(h => h !== trimmed);
  state.history.unshift(trimmed);
  state.history = state.history.slice(0, CONFIG.historyLimit);
  store.set(CONFIG.storage.history, state.history);
}

function renderHeroTips() {
  const wrap = $('heroTips');
  wrap.innerHTML = '';
  HERO_TIPS.slice(0, 5).forEach(tip => {
    const btn = el('button', { class: 'hero-tip', text: tip });
    btn.addEventListener('click', () => {
      $('searchInput').value = tip;
      updateSearchUI();
      runSearch(false);
    });
    wrap.appendChild(btn);
  });
}

function buildShortcuts() {
  const grid = $('shortcutsGrid');
  grid.innerHTML = '';
  SHORTCUTS.forEach(s => {
    grid.appendChild(el('div', { class: 'shortcut-item' }, [
      el('span', { text: s.label }),
      el('div', { class: 'shortcut-keys' }, s.keys.map(k => el('kbd', { text: k }))),
    ]));
  });
}

function updateSearchUI() {
  const input = $('searchInput');
  const clear = $('searchClear');
  const badge = $('urlBadge');
  const val = input.value.trim();
  clear.classList.toggle('show', val.length > 0);
  badge.classList.toggle('show', isURL(val));
}

function renderFilterChips() {
  const wrap = $('filterChips');
  wrap.innerHTML = '';
  FILTERS.forEach(f => {
    const count = getFilterCount(f.key);
    const chip = el('button', {
      class: 'chip' + (state.filter === f.key ? ' active' : ''),
      'data-filter': f.key,
    });
    chip.innerHTML = `${f.icon}<span>${f.label}</span><span class="chip-count">${count}</span>`;
    chip.addEventListener('click', () => {
      state.filter = f.key;
      $$('#filterChips .chip').forEach(c => c.classList.toggle('active', c.dataset.filter === f.key));
      applyFilter();
    });
    wrap.appendChild(chip);
  });
}

function getFilterCount(key) {
  if (key === 'all') return state.pins.length;
  if (key === 'video') return state.pins.filter(p => p.is_video).length;
  if (key === 'image') return state.pins.filter(p => !p.is_video).length;
  if (key === 'favorites') return state.pins.filter(p => isFavorite(p.pin_id)).length;
  return 0;
}

function applyFilter() {
  let pins = state.pins.slice();
  if (state.filter === 'video') pins = pins.filter(p => p.is_video);
  else if (state.filter === 'image') pins = pins.filter(p => !p.is_video);
  else if (state.filter === 'favorites') pins = pins.filter(p => isFavorite(p.pin_id));
  state.filtered = pins;
  renderGrid(pins, false);
  updateResultsInfo();
  renderFilterChips();
}

function updateResultsInfo() {
  const info = $('resultsInfo');
  if (!state.pins.length) { info.style.display = 'none'; return; }
  info.style.display = 'flex';
  $('resultsTitle').textContent = state.title || 'Results';
  const shown = state.filtered.length;
  const total = state.pins.length;
  const label = state.filter === 'all'
    ? `${total} pin${total === 1 ? '' : 's'}`
    : `${shown} of ${total}`;
  $('resultsCount').textContent = label;
}

function renderSkeletons(count) {
  const grid = $('grid');
  grid.innerHTML = '';
  const frag = document.createDocumentFragment();
  for (let i = 0; i < count; i++) {
    frag.appendChild(el('div', { class: 'skeleton' }));
  }
  grid.appendChild(frag);
  $('resultsInfo').style.display = 'none';
}

function renderEmpty(title, sub) {
  const grid = $('grid');
  grid.innerHTML = '';
  const empty = el('div', { class: 'empty' });
  empty.innerHTML = `
    <img class="empty-logo" src="${LOGO}" alt="">
    <h3>${escapeHtml(title)}</h3>
    <p>${sub}</p>`;
  grid.appendChild(empty);
  $('resultsInfo').style.display = 'none';
  $('loadMoreWrap').style.display = 'none';
}

function renderError(msg) {
  const grid = $('grid');
  grid.innerHTML = '';
  const empty = el('div', { class: 'empty' });
  empty.innerHTML = `
    <img class="empty-logo" src="${LOGO}" alt="">
    <h3>Something went wrong</h3>
    <p>${escapeHtml(msg)}</p>`;
  grid.appendChild(empty);
  $('resultsInfo').style.display = 'none';
  $('loadMoreWrap').style.display = 'none';
}

function buildCard(pin) {
  const isFav = isFavorite(pin.pin_id);
  const dlHref = downloadHref(pin);
  const card = el('div', { class: 'card', 'data-pin-id': pin.pin_id || '' });

  const badges = [];
  if (pin.is_video) badges.push(`<span class="card-badge video">${ICONS.video}Video</span>`);

  const thumbContent = pin.thumbnail_url
    ? `<img src="${escapeHtml(pin.thumbnail_url)}" alt="" loading="lazy" referrerpolicy="no-referrer">`
    : `<div class="thumb-placeholder">${ICONS.image}</div>`;

  card.innerHTML = `
    <div class="card-thumb" data-open>
      ${thumbContent}
      ${badges.length ? `<div class="card-badges">${badges.join('')}</div>` : ''}
      <button class="card-fav ${isFav ? 'active' : ''}" data-fav title="Favorite">
        ${isFav ? ICONS.heartFill : ICONS.heart}
      </button>
      <div class="card-overlay">
        <div class="card-overlay-actions">
          ${dlHref ? `<a class="card-action primary" href="${dlHref}" data-download title="Download">${ICONS.download}<span>Download</span></a>` : ''}
          <button class="card-action ghost" data-copy title="Copy link">${ICONS.copy}</button>
          ${pin.pin_url ? `<a class="card-action ghost" href="${escapeHtml(pin.pin_url)}" target="_blank" rel="noopener" title="Open">${ICONS.external}</a>` : ''}
        </div>
      </div>
    </div>
    <div class="card-body">
      <div class="card-title ${pin.title ? '' : 'empty'}">${escapeHtml(pin.title || 'Untitled pin')}</div>
      <div class="card-actions-row">
        ${dlHref ? `<a class="card-btn-sm dl" href="${dlHref}" data-download>${ICONS.download}<span>Save</span></a>` : ''}
        <button class="card-btn-sm ghost icon-only" data-copy title="Copy">${ICONS.copy}</button>
        ${pin.pin_url ? `<a class="card-btn-sm ghost icon-only" href="${escapeHtml(pin.pin_url)}" target="_blank" rel="noopener" title="Open">${ICONS.external}</a>` : ''}
      </div>
    </div>`;

  const img = card.querySelector('.card-thumb img');
  if (img) {
    if (img.complete && img.naturalWidth) img.classList.add('loaded');
    else {
      img.addEventListener('load', () => img.classList.add('loaded'), { once: true });
      img.addEventListener('error', () => {
        const wrap = card.querySelector('.card-thumb');
        if (wrap && !wrap.querySelector('.thumb-placeholder')) {
          wrap.insertAdjacentHTML('afterbegin', `<div class="thumb-placeholder">${ICONS.image}</div>`);
        }
      }, { once: true });
    }
  }

  card.addEventListener('click', (e) => {
    if (e.target.closest('[data-fav]')) {
      e.preventDefault();
      e.stopPropagation();
      toggleFavorite(pin);
      return;
    }
    if (e.target.closest('[data-download]') || e.target.closest('a[target="_blank"]')) return;
    if (e.target.closest('[data-copy]')) {
      e.preventDefault();
      e.stopPropagation();
      const url = pin.pin_url || pin.download_url;
      if (url) {
        navigator.clipboard.writeText(url);
        toast('Link copied', 'success');
      }
      return;
    }
    if (e.target.closest('[data-open]')) {
      openLightbox(pin);
      return;
    }
    openLightbox(pin);
  });

  return card;
}

function renderGrid(pins, append) {
  const grid = $('grid');
  if (!append) grid.innerHTML = '';
  if (!pins.length) {
    if (!append) renderEmpty('No pins to show', 'Try a different filter or search again.');
    return;
  }
  const frag = document.createDocumentFragment();
  pins.forEach(pin => frag.appendChild(buildCard(pin)));
  if (append) grid.appendChild(frag);
  else grid.appendChild(frag);
}

async function runSearch(isLoadMore) {
  const input = $('searchInput');
  const val = input.value.trim();

  if (!isLoadMore) {
    if (!val) {
      input.focus();
      toast('Enter a search term or URL', 'error');
      return;
    }
    state.currentInput = val;
    state.bookmark = null;
    state.pins = [];
    state.filtered = [];
    state.title = '';
    addHistory(val);
    $('hero').classList.add('hidden');
    $('controls').style.display = 'flex';
    renderSkeletons(12);
    state.filter = 'all';
  }

  state.loading = true;
  state.loadingMore = isLoadMore;
  updateSearchLoading();

  try {
    const res = await fetch(CONFIG.resolveEndpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        input: state.currentInput,
        bookmark: isLoadMore ? state.bookmark : null,
      }),
    });
    const data = await res.json();

    if (!data.ok) {
      if (!isLoadMore) renderError(data.error || 'Failed to fetch pins');
      else toast(data.error || 'Failed to load more', 'error');
      $('loadMoreWrap').style.display = 'none';
      return;
    }

    state.title = data.title || '';
    const newPins = data.pins || [];
    state.bookmark = data.bookmark || null;

    if (isLoadMore) {
      const existingIds = new Set(state.pins.map(p => p.pin_id));
      const unique = newPins.filter(p => !existingIds.has(p.pin_id));
      state.pins = state.pins.concat(unique);
      state.filtered = state.filtered.concat(unique);
      renderGrid(unique, true);
    } else {
      state.pins = newPins;
      state.filtered = newPins;
      if (!newPins.length) {
        renderEmpty('No pins found', 'This link or search returned no results. Try another query.');
      } else {
        renderGrid(newPins, false);
      }
    }

    updateResultsInfo();
    renderFilterChips();
    $('loadMoreWrap').style.display = state.bookmark ? 'flex' : 'none';
    if (!isLoadMore && newPins.length) toast(`${newPins.length} pin${newPins.length === 1 ? '' : 's'} loaded`, 'success');
  } catch (err) {
    if (!isLoadMore) renderError('Network error — please try again.');
    else toast('Failed to load more', 'error');
  } finally {
    state.loading = false;
    state.loadingMore = false;
    updateSearchLoading();
  }
}

function updateSearchLoading() {
  const btn = $('searchBtn');
  if (state.loading && !state.loadingMore) {
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner"></div><span>Loading…</span>';
  } else {
    btn.disabled = false;
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><span>Search</span>';
  }

  const loadMore = $('loadMoreBtn');
  if (state.loadingMore) {
    loadMore.disabled = true;
    loadMore.innerHTML = '<div class="spinner"></div><span>Loading…</span>';
  } else {
    loadMore.disabled = false;
    loadMore.innerHTML = '<span>Load more</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
  }
}

function openLightbox(pin) {
  if (!pin) return;
  state.activePin = pin;
  const img = $('lightboxImg');
  img.src = pin.thumbnail_url || '';
  $('lightboxTitle').textContent = pin.title || 'Untitled pin';

  const chips = [];
  if (pin.is_video) chips.push(`<span class="lightbox-chip">${ICONS.video}Video</span>`);
  else chips.push(`<span class="lightbox-chip">${ICONS.image}Image</span>`);
  if (pin.pin_id) chips.push(`<span class="lightbox-chip">ID ${escapeHtml(pin.pin_id)}</span>`);
  $('lightboxChips').innerHTML = chips.join('');

  const dlHref = downloadHref(pin);
  $('lbDownload').href = dlHref || '#';
  $('lbDownload').style.display = dlHref ? '' : 'none';

  $('lbOpen').href = pin.pin_url || '#';
  $('lbOpen').style.display = pin.pin_url ? '' : 'none';

  const isFav = isFavorite(pin.pin_id);
  $('lbFav').innerHTML = isFav ? ICONS.heartFill : ICONS.heart;
  $('lbFav').classList.toggle('btn-soft', isFav);

  $('lightbox').classList.add('open');
  $('lightboxMedia').classList.remove('zoomed');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  $('lightbox').classList.remove('open');
  $('lightboxMedia').classList.remove('zoomed');
  document.body.style.overflow = '';
  state.activePin = null;
}

function openFavDrawer() {
  renderFavorites();
  $('favDrawer').classList.add('open');
  $('overlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeDrawer() {
  $$('.drawer').forEach(d => d.classList.remove('open'));
  $('overlay').classList.remove('show');
  document.body.style.overflow = '';
}

function renderFavorites() {
  const body = $('favBody');
  const favs = Array.from(state.favorites.values()).sort((a, b) => b.savedAt - a.savedAt);
  if (!favs.length) {
    body.innerHTML = `
      <div class="drawer-empty">
        <img class="drawer-empty-logo" src="${LOGO}" alt="">
        <h3>No favorites yet</h3>
        <p>Tap the heart on any pin to save it here.</p>
      </div>`;
    return;
  }
  body.innerHTML = '';
  favs.forEach(fav => {
    const item = el('div', { class: 'fav-item' });
    const dlHref = downloadHref(fav);
    item.innerHTML = `
      <img class="fav-thumb" src="${escapeHtml(fav.thumbnail_url || '')}" alt="" referrerpolicy="no-referrer">
      <div class="fav-info">
        <div class="fav-title">${escapeHtml(fav.title || 'Untitled pin')}</div>
        <div class="fav-actions">
          ${dlHref ? `<a class="fav-dl" href="${dlHref}" data-stop>${ICONS.download}Save</a>` : ''}
          <button class="fav-rm" data-stop data-remove>${ICONS.x}Remove</button>
        </div>
      </div>`;
    item.addEventListener('click', (e) => {
      if (e.target.closest('[data-remove]')) {
        e.preventDefault();
        e.stopPropagation();
        state.favorites.delete(fav.pin_id);
        saveFavorites();
        renderFavorites();
        refreshFavoriteUI();
        toast('Removed', 'info');
        return;
      }
      if (e.target.closest('[data-stop]')) return;
      closeDrawer();
      openLightbox(fav);
    });
    body.appendChild(item);
  });
}

function openCmdk() {
  $('cmdk').classList.add('open');
  $('cmdkInput').value = '';
  $('cmdkInput').focus();
  renderCmdk('');
}

function closeCmdk() {
  $('cmdk').classList.remove('open');
}

function getCommands() {
  return [
    { icon: ICONS.download, label: 'Search pins', desc: 'Focus the search bar', keys: ['/'], fn: () => { closeCmdk(); $('searchInput').focus(); } },
    { icon: ICONS.heart, label: 'Open favorites', desc: `${state.favorites.size} saved pins`, keys: ['⌘', 'F'], fn: () => { closeCmdk(); openFavDrawer(); } },
    { icon: ICONS.spark, label: 'Toggle theme', desc: 'Light / dark mode', keys: ['⌘', 'J'], fn: () => { closeCmdk(); applyTheme(state.theme === 'dark' ? 'light' : 'dark'); } },
    { icon: ICONS.shuffle, label: 'Random search', desc: 'Try a random prompt', fn: () => {
      closeCmdk();
      const tip = HERO_TIPS[Math.floor(Math.random() * HERO_TIPS.length)];
      $('searchInput').value = tip;
      updateSearchUI();
      runSearch(false);
    } },
    { icon: ICONS.x, label: 'Clear results', desc: 'Reset the grid', keys: ['⌘', '⇧', 'C'], fn: () => { closeCmdk(); clearResults(); } },
    { icon: ICONS.info, label: 'Show shortcuts', desc: 'Keyboard reference', keys: ['?'], fn: () => { closeCmdk(); openShortcuts(); } },
    ...FILTERS.map(f => ({
      icon: f.icon,
      label: `Filter: ${f.label}`,
      desc: `Show only ${f.label.toLowerCase()} pins`,
      fn: () => {
        closeCmdk();
        state.filter = f.key;
        $$('#filterChips .chip').forEach(c => c.classList.toggle('active', c.dataset.filter === f.key));
        applyFilter();
      },
    })),
  ];
}

function renderCmdk(query) {
  const q = query.trim().toLowerCase();
  const all = getCommands();
  const filtered = q
    ? all.filter(c => c.label.toLowerCase().includes(q) || c.desc.toLowerCase().includes(q))
    : all;
  state.cmdkItems = filtered;
  state.cmdkIndex = 0;
  const body = $('cmdkBody');
  if (!filtered.length) {
    body.innerHTML = `<div style="padding:40px;text-align:center;color:var(--text-3);font-size:13px">No commands match "${escapeHtml(q)}"</div>`;
    return;
  }
  body.innerHTML = '<div class="cmdk-group-label">Commands</div>';
  filtered.forEach((c, i) => {
    const item = el('button', { class: 'cmdk-item' + (i === 0 ? ' active' : '') });
    item.innerHTML = `
      <div class="cmdk-ico">${c.icon}</div>
      <div class="cmdk-text">
        <div class="cmdk-label">${escapeHtml(c.label)}</div>
        <div class="cmdk-desc">${escapeHtml(c.desc)}</div>
      </div>
      ${c.keys ? `<div class="shortcut-keys">${c.keys.map(k => `<kbd>${k}</kbd>`).join('')}</div>` : ''}`;
    item.addEventListener('click', () => c.fn());
    item.addEventListener('mouseenter', () => setCmdkIndex(i));
    body.appendChild(item);
  });
}

function setCmdkIndex(i) {
  if (i < 0 || i >= state.cmdkItems.length) return;
  state.cmdkIndex = i;
  $$('.cmdk-item').forEach((node, n) => node.classList.toggle('active', n === i));
  const active = $$('.cmdk-item')[i];
  if (active) active.scrollIntoView({ block: 'nearest' });
}

function openShortcuts() { $('shortcuts').classList.add('open'); }
function closeShortcuts() { $('shortcuts').classList.remove('open'); }

function clearResults() {
  if (!state.pins.length) {
    toast('Nothing to clear', 'info');
    return;
  }
  state.pins = [];
  state.filtered = [];
  state.bookmark = null;
  state.title = '';
  state.currentInput = '';
  $('searchInput').value = '';
  updateSearchUI();
  $('controls').style.display = 'none';
  $('resultsInfo').style.display = 'none';
  $('loadMoreWrap').style.display = 'none';
  $('hero').classList.remove('hidden');
  renderEmpty('Ready when you are', `Paste a Pinterest link or type a search term above to get started.`);
  toast('Cleared', 'success');
}

function showHistoryDropdown() {
  const dd = $('historyDropdown');
  if (!state.history.length) {
    dd.classList.remove('show');
    return;
  }
  dd.innerHTML = `
    <div class="history-head">
      <span>Recent searches</span>
      <button id="clearHistoryBtn">Clear</button>
    </div>`;
  state.history.forEach(q => {
    const item = el('button', { class: 'history-item' });
    item.innerHTML = `${ICONS.history}<span class="hist-text">${escapeHtml(q)}</span><span class="hist-remove" data-remove>${ICONS.x}</span>`;
    item.addEventListener('click', (e) => {
      if (e.target.closest('[data-remove]')) {
        e.stopPropagation();
        state.history = state.history.filter(h => h !== q);
        store.set(CONFIG.storage.history, state.history);
        showHistoryDropdown();
        return;
      }
      $('searchInput').value = q;
      updateSearchUI();
      hideHistoryDropdown();
      runSearch(false);
    });
    dd.appendChild(item);
  });
  dd.querySelector('#clearHistoryBtn')?.addEventListener('click', (e) => {
    e.stopPropagation();
    state.history = [];
    store.set(CONFIG.storage.history, []);
    hideHistoryDropdown();
  });
  dd.classList.add('show');
}

function hideHistoryDropdown() {
  $('historyDropdown').classList.remove('show');
}

function initKeyboard() {
  const mod = navigator.platform.toUpperCase().includes('MAC') ? '⌘' : 'Ctrl';
  $('modKey').textContent = mod;

  document.addEventListener('keydown', (e) => {
    const isInput = ['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName);
    const cmd = e.metaKey || e.ctrlKey;

    if (cmd && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      $('cmdk').classList.contains('open') ? closeCmdk() : openCmdk();
      return;
    }
    if (cmd && e.key.toLowerCase() === 'j') {
      e.preventDefault();
      applyTheme(state.theme === 'dark' ? 'light' : 'dark');
      return;
    }
    if (cmd && e.key.toLowerCase() === 'f') {
      e.preventDefault();
      $('favDrawer').classList.contains('open') ? closeDrawer() : openFavDrawer();
      return;
    }
    if (cmd && e.shiftKey && e.key.toLowerCase() === 'c') {
      e.preventDefault();
      clearResults();
      return;
    }

    if (isInput) return;

    if (e.key === '/') {
      e.preventDefault();
      $('searchInput').focus();
      return;
    }
    if (e.key === '?') {
      e.preventDefault();
      openShortcuts();
      return;
    }
    if (e.key === 'Escape') {
      if ($('cmdk').classList.contains('open')) { closeCmdk(); return; }
      if ($('shortcuts').classList.contains('open')) { closeShortcuts(); return; }
      if ($('lightbox').classList.contains('open')) { closeLightbox(); return; }
      if ($('overlay').classList.contains('show')) { closeDrawer(); return; }
      if ($('historyDropdown').classList.contains('show')) { hideHistoryDropdown(); return; }
    }
  });
}

function wireEvents() {
  $('themeBtn').addEventListener('click', () => applyTheme(state.theme === 'dark' ? 'light' : 'dark'));
  $('cmdTrigger').addEventListener('click', openCmdk);
  $('shortcutsBtn').addEventListener('click', openShortcuts);
  $('favBtn').addEventListener('click', openFavDrawer);

  $('searchInput').addEventListener('input', updateSearchUI);
  $('searchInput').addEventListener('focus', () => {
    if (state.history.length) showHistoryDropdown();
  });
  $('searchInput').addEventListener('blur', () => {
    setTimeout(hideHistoryDropdown, 200);
  });
  $('searchInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      hideHistoryDropdown();
      runSearch(false);
    }
  });

  $('searchClear').addEventListener('click', () => {
    $('searchInput').value = '';
    updateSearchUI();
    $('searchInput').focus();
  });

  $('searchBtn').addEventListener('click', () => runSearch(false));
  $('loadMoreBtn').addEventListener('click', () => runSearch(true));

  $$('#layoutSeg button').forEach(b => {
    b.addEventListener('click', () => setLayout(b.dataset.layout));
  });

  $('overlay').addEventListener('click', closeDrawer);
  $$('[data-close-drawer]').forEach(b => b.addEventListener('click', closeDrawer));

  $('lightboxClose').addEventListener('click', closeLightbox);
  $('lightbox').addEventListener('click', (e) => {
    if (e.target.id === 'lightbox') closeLightbox();
  });
  $('lightboxMedia').addEventListener('click', (e) => {
    if (e.target.tagName === 'IMG') {
      $('lightboxMedia').classList.toggle('zoomed');
    }
  });
  $('lbCopy').addEventListener('click', () => {
    if (!state.activePin) return;
    const url = state.activePin.pin_url || state.activePin.download_url;
    if (url) {
      navigator.clipboard.writeText(url);
      toast('Link copied', 'success');
    }
  });
  $('lbFav').addEventListener('click', () => {
    if (!state.activePin) return;
    toggleFavorite(state.activePin);
  });

  $('shortcutsClose').addEventListener('click', closeShortcuts);
  $('shortcuts').addEventListener('click', (e) => {
    if (e.target.id === 'shortcuts') closeShortcuts();
  });

  $('cmdk').addEventListener('click', (e) => {
    if (e.target.id === 'cmdk') closeCmdk();
  });
  $('cmdkInput').addEventListener('input', (e) => renderCmdk(e.target.value));
  $('cmdkInput').addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      setCmdkIndex(Math.min(state.cmdkIndex + 1, state.cmdkItems.length - 1));
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      setCmdkIndex(Math.max(state.cmdkIndex - 1, 0));
    } else if (e.key === 'Enter') {
      e.preventDefault();
      const c = state.cmdkItems[state.cmdkIndex];
      if (c) c.fn();
    } else if (e.key === 'Escape') {
      closeCmdk();
    }
  });

  $('homeBtn').addEventListener('click', (e) => {
    e.preventDefault();
    clearResults();
    $('searchInput').focus();
  });
}

function init() {
  const savedTheme = store.get(CONFIG.storage.theme, null);
  state.theme = savedTheme || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  applyTheme(state.theme);

  const savedLayout = store.get(CONFIG.storage.layout, 'default');
  setLayout(savedLayout);

  state.history = store.get(CONFIG.storage.history, []);
  loadFavorites();
  updateFavBadge();

  renderHeroTips();
  buildShortcuts();
  renderFilterChips();
  wireEvents();
  initKeyboard();

  renderEmpty(
    'Ready when you are',
    `Paste a <kbd>pinterest.com/pin/…</kbd> link, a board URL, or type a keyword to start grabbing pins.`
  );

  setTimeout(() => $('splash').classList.add('hide'), 700);
  setTimeout(() => $('searchInput').focus(), 900);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
</body>
</html>
