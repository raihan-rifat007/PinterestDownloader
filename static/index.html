<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pinterest Downloader</title>
<style>
  :root {
    --bg: #0e0e10;
    --surface: #18181b;
    --border: #2a2a2e;
    --text: #f4f4f5;
    --muted: #9a9aa2;
    --accent: #e60023;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    padding: 32px 16px 80px;
  }

  .wrap { max-width: 1000px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 28px; }
  header h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
  header p { color: var(--muted); font-size: 14px; }

  .search-box {
    display: flex;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px;
    margin-bottom: 24px;
  }

  .search-box input {
    flex: 1;
    background: none;
    border: none;
    color: var(--text);
    font-size: 15px;
    padding: 10px 12px;
    outline: none;
  }

  .search-box input::placeholder { color: var(--muted); }

  .search-box button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0 22px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  .search-box button:disabled { opacity: 0.5; cursor: not-allowed; }

  .status {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 24px;
  }

  .status.error { color: #ff6b6b; }

  .results-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 14px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 14px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .card .thumb {
    position: relative;
    aspect-ratio: 3/4;
    background: #000;
  }

  .card .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .card .badge {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(0, 0, 0, 0.7);
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 7px;
    border-radius: 6px;
  }

  .card .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; }

  .card .title {
    font-size: 13px;
    line-height: 1.4;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    min-height: 36px;
  }

  .card .actions { display: flex; gap: 6px; }

  .card a.btn {
    flex: 1;
    text-align: center;
    text-decoration: none;
    font-size: 12px;
    font-weight: 600;
    padding: 8px 6px;
    border-radius: 7px;
  }

  .card a.download {
    background: var(--accent);
    color: #fff;
  }

  .card a.open {
    background: var(--border);
    color: var(--text);
  }

  .load-more {
    display: block;
    margin: 28px auto 0;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
    padding: 12px 28px;
    border-radius: 10px;
    cursor: pointer;
  }

  .load-more:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Pinterest Downloader</h1>
    <p>Paste a pin, board, or profile link, or type a search term</p>
  </header>

  <div class="search-box">
    <input type="text" id="input" placeholder="https://www.pinterest.com/pin/... or a search term">
    <button id="go">Search</button>
  </div>

  <div id="status" class="status"></div>
  <div id="resultsTitle" class="results-title" style="display:none;"></div>
  <div id="grid" class="grid"></div>
  <button id="loadMore" class="load-more" style="display:none;">Load more</button>
</div>

<script>
(function () {
  var inputEl = document.getElementById("input");
  var goBtn = document.getElementById("go");
  var statusEl = document.getElementById("status");
  var titleEl = document.getElementById("resultsTitle");
  var gridEl = document.getElementById("grid");
  var loadMoreBtn = document.getElementById("loadMore");

  var currentInput = null;
  var currentBookmark = null;

  function setStatus(text, isError) {
    statusEl.textContent = text || "";
    statusEl.className = isError ? "status error" : "status";
  }

  function escapeHtml(value) {
    var div = document.createElement("div");
    div.textContent = value === null || value === undefined ? "" : String(value);
    return div.innerHTML;
  }

  function downloadHref(pin) {
    if (!pin.download_url) return null;
    var params = new URLSearchParams({ url: pin.download_url, filename: pin.filename || "download" });
    return "/api/download?" + params.toString();
  }

  function renderPins(pins, append) {
    var html = pins.map(function (pin) {
      var dlHref = downloadHref(pin);
      return (
        '<div class="card">' +
          '<div class="thumb">' +
            '<img src="' + escapeHtml(pin.thumbnail_url || "") + '" loading="lazy" alt="">' +
            (pin.is_video ? '<span class="badge">Video</span>' : "") +
          "</div>" +
          '<div class="body">' +
            '<div class="title">' + escapeHtml(pin.title) + "</div>" +
            '<div class="actions">' +
              (dlHref ? '<a class="btn download" href="' + dlHref + '">Download</a>' : "") +
              (pin.pin_url ? '<a class="btn open" href="' + escapeHtml(pin.pin_url) + '" target="_blank" rel="noopener">Open</a>' : "") +
            "</div>" +
          "</div>" +
        "</div>"
      );
    }).join("");

    if (append) {
      gridEl.insertAdjacentHTML("beforeend", html);
    } else {
      gridEl.innerHTML = html;
    }
  }

  function runSearch(isLoadMore) {
    var value = inputEl.value.trim();
    if (!value) return;

    if (!isLoadMore) {
      currentInput = value;
      currentBookmark = null;
      gridEl.innerHTML = "";
      titleEl.style.display = "none";
      loadMoreBtn.style.display = "none";
    }

    goBtn.disabled = true;
    loadMoreBtn.disabled = true;
    setStatus(isLoadMore ? "Loading more..." : "Loading...", false);

    fetch("/api/resolve", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        input: currentInput,
        bookmark: isLoadMore ? currentBookmark : null,
      }),
    })
      .then(function (res) {
        return res.json().then(function (data) {
          return { status: res.status, data: data };
        });
      })
      .then(function (result) {
        var data = result.data;
        if (!data.ok) {
          setStatus(data.error || "Something went wrong", true);
          return;
        }

        setStatus("", false);
        titleEl.textContent = data.title || "";
        titleEl.style.display = data.title ? "block" : "none";

        if (!data.pins || data.pins.length === 0) {
          if (!isLoadMore) {
            setStatus("No results found", false);
          }
          loadMoreBtn.style.display = "none";
          return;
        }

        renderPins(data.pins, isLoadMore);
        currentBookmark = data.bookmark || null;
        loadMoreBtn.style.display = currentBookmark ? "block" : "none";
      })
      .catch(function (err) {
        setStatus("Network error: " + err.message, true);
      })
      .finally(function () {
        goBtn.disabled = false;
        loadMoreBtn.disabled = false;
      });
  }

  goBtn.addEventListener("click", function () { runSearch(false); });
  inputEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter") runSearch(false);
  });
  loadMoreBtn.addEventListener("click", function () { runSearch(true); });
})();
</script>

</body>
</html>
